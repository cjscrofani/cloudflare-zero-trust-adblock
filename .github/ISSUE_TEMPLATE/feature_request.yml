name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine it working? Links to Cloudflare docs or other projects are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
